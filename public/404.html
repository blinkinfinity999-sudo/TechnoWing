<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TechnoWing — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page Application redirect script
      // Redirects 404 paths back to index.html with query/hash preserved
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">TechnoWing</a>...</p>
  </body>
</html>
